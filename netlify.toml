[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# API proxy to Netlify Functions (must be BEFORE the SPA fallback)

[[redirects]]
  from = "/api/verify-player"
  to = "/.netlify/functions/verify-player"
  status = 200

[[redirects]]
  from = "/api/create-payment"
  to = "/.netlify/functions/create-payment"
  status = 200

[[redirects]]
  from = "/api/payment-callback"
  to = "/.netlify/functions/payment-callback"
  status = 200

# SPA fallback - redirect all other routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
